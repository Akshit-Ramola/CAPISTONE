apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codedeck-ingress
  labels:
    app.kubernetes.io/name: codedeck-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: sandbox.local
      http:
        paths:
          - pathType: Prefix
            path: "/api/sandbox"
            backend:
              service:
                name: sandbox-service
                port:
                  number: 80
